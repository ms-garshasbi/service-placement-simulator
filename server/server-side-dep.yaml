apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecsp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecsp-server
  template:
    metadata:
      labels:
        app: ecsp-server
    spec:
      containers:
        - name: ecsp-server
          image: YOUR_DOCKERHUB_USERNAME/ecsp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
